<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Valentina ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #090B16;
            --bg-card: #121629;
            --accent-purple: #8B5CF6;
            --accent-blue: #3B82F6;
            --text-light: #F3F4F6;
            --text-gold: #FACE15;
            --border-glow: rgba(139, 92, 246, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .welcome-title {
            color: var(--accent-blue);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #9CA3AF;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .word-display {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 40px;
            height: 48px;
            border: 2px solid var(--accent-purple);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 800;
            background: rgba(139, 92, 246, 0.1);
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 1.5rem;
        }

        .key-btn {
            background: #1E2640;
            color: white;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 10px 0;
            font-weight: 700;
            cursor: pointer;
        }

        .key-btn:hover { background: var(--accent-purple); }

        .hint-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--accent-blue);
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            text-decoration: none;
            display: inline-block;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Tela Inicial / Jogo -->
    <div id="screen-game">
        <h1 class="welcome-title">Para Valentina ✨</h1>
        <p class="subtitle">Adivinhe as palavras em inglês para descobrir cada mensagem.</p>
        
        <div class="hint-box" id="hint-text">
            Carregando...
        </div>

        <div class="word-display" id="word-slots"></div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <!-- Tela Final -->
    <div id="screen-final" class="hidden">
        <h2 style="color: var(--text-gold); font-size: 1.8rem; margin-bottom: 0.5rem;">Você Zerou! 🎉</h2>
        <p style="margin-bottom: 1.5rem; color: #D1D5DB; line-height: 1.6;">
            "Mesmo com a camisa do Flamengo, você continua sendo a pessoa mais incrível pra mim. Mal posso esperar pelo nosso encontro! ❤️"
        </p>

        <a class="btn-action" href="https://api.whatsapp.com/send?text=Oii! Vi todas as mensagens do joguinho! Amei demais ❤️✨" target="_blank">
            Mandar mensagem no WhatsApp 💬
        </a>
    </div>
</div>

<script>
    const levels = [
        { word: "DRESS", hint: "💌 'Lembro até hoje de uma das nossas primeiras conversas, quando você ia comprar um vestido... guardo esse detalhe até agora.'" },
        { word: "SMART", hint: "💌 'Admiro demais o quanto você é inteligente, dedicada e esforçada em tudo o que faz na sua vida.'" },
        { word: "EYES", hint: "💌 'E não posso deixar de falar dos seus olhos... me perco completamente neles toda vez que te olho.'" },
        { word: "FLAMENGO", hint: "💌 'Um dos maiores acertos da minha vida foi te dar um buquê. Mas quando te vi com ele, só pensei: *Por que carambas ela tá com essa camisa? Estragou tudo!* 😂⚽'" },
        { word: "FLOWERS", hint: "💌 'Brincadeiras à parte... acho que me apaixonei de novo quando te vi com aquele buquê. Por mim, eu te daria um todo santo mês.'" }
    ];

    let currentLevel = 0;
    let guessedLetters = [];

    function initLevel() {
        const level = levels[currentLevel];
        document.getElementById('hint-text').innerText = level.hint;
        guessedLetters = [];
        renderWord();
        renderKeyboard();
    }

    function renderWord() {
        const level = levels[currentLevel];
        const container = document.getElementById('word-slots');
        container.innerHTML = '';
        
        let won = true;
        for (let letter of level.word) {
            const box = document.createElement('div');
            box.className = 'letter-box';
            if (guessedLetters.includes(letter)) {
                box.innerText = letter;
            } else {
                box.innerText = '';
                won = false;
            }
            container.appendChild(box);
        }

        if (won) {
            setTimeout(() => {
                currentLevel++;
                if (currentLevel < levels.length) {
                    initLevel();
                } else {
                    showFinalScreen();
                }
            }, 600);
        }
    }

    function renderKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
        alphabet.forEach(letra => {
            const btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.innerText = letra;
            btn.onclick = () => {
                if (!guessedLetters.includes(letra)) {
                    guessedLetters.push(letra);
                    renderWord();
                }
            };
            kb.appendChild(btn);
        });
    }

    function showFinalScreen() {
        document.getElementById('screen-game').classList.add('hidden');
        document.getElementById('screen-final').classList.remove('hidden');
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    initLevel();
</script>
</body>
</html>
