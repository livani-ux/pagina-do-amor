<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Mente do Victor para a Valentina ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #090B16;
            --bg-card: #121629;
            --accent-purple: #8B5CF6;
            --accent-blue: #3B82F6;
            --text-light: #F3F4F6;
            --text-gold: #FACE15;
            --border-glow: rgba(139, 92, 246, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Corações flutuantes ao fundo */
        .heart-particle {
            position: fixed;
            color: rgba(139, 92, 246, 0.25);
            font-size: 1.2rem;
            animation: floatUp 6s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(8px);
            animation: cardAppear 0.8s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .welcome-title {
            color: var(--accent-blue);
            font-size: 1.7rem;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        /* Grade de Categorias */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .cat-btn {
            background: #1E2640;
            color: white;
            border: 1px solid #374151;
            padding: 16px 10px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .cat-btn span { font-size: 1.5rem; }

        .cat-btn:hover {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .cat-btn.viewed {
            border-color: var(--text-gold);
        }

        /* Caixa de Exibição do Texto */
        .content-box {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 1.25rem;
            border-radius: 14px;
            min-height: 120px;
            text-align: left;
            font-size: 0.98rem;
            line-height: 1.6;
            color: #E2E8F0;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: transparent;
            color: #9CA3AF;
            border: 1px solid #4B5563;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: white;
            border-color: white;
        }

        /* Seção Final do Convite */
        .final-section {
            margin-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.2rem;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.02);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<!-- Corações ao fundo -->
<script>
    for (let i = 0; i < 15; i++) {
        let heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.innerText = ['❤️', '✨', '💜', '🌹'][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        document.body.appendChild(heart);
    }
</script>

<div class="container">
    <!-- Tela Principal: Menu de Categorias -->
    <div id="screen-menu">
        <h1 class="welcome-title">A Mente do Victor 🧠✨</h1>
        <p class="subtitle">Toque em cada tópico para descobrir o que passa na minha cabeça sobre você, Valentina:</p>

        <div class="categories-grid">
            <button class="cat-btn" id="btn-olhos" onclick="openCategory('olhos')">
                <span>👁️</span> Olhos
            </button>
            <button class="cat-btn" id="btn-vestido" onclick="openCategory('vestido')">
                <span>👗</span> Vestido
            </button>
            <button class="cat-btn" id="btn-estudos" onclick="openCategory('estudos')">
                <span>📚</span> Esforçada
            </button>
            <button class="cat-btn" id="btn-buque" onclick="openCategory('buque')">
                <span>💐</span> O Buquê
            </button>
        </div>

        <!-- Caixa onde aparece o texto da categoria selecionada -->
        <div class="content-box" id="display-text" style="color: #9CA3AF; text-align: center; justify-content: center;">
            👈 Clique em um dos tópicos acima para ler!
        </div>

        <div class="hidden" id="nav-back-container">
            <button class="back-btn" onclick="goBackToMenu()">⬅️ Escolher outro tópico</button>
        </div>

        <!-- Seção Final / Convite -->
        <div class="final-section">
            <p style="font-size: 0.9rem; color: #D1D5DB; margin-bottom: 1rem; line-height: 1.5;">
                Já faz 1 ano que a gente se conhece e nunca saímos... Quero muito mudar isso. Qual dia você está livre? ❤️
            </p>
            <a class="btn-action" href="https://api.whatsapp.com/send?text=Oii! Li tudo na Mente do Victor... e sobre o nosso rolê, eu tô livre no dia: " target="_blank">
                Responder no WhatsApp 💬
            </a>
        </div>
    </div>
</div>

<script>
    const categoryData = {
        olhos: "👁️ **Olhos:** Eu acho os seus olhos tão lindos... A primeira vez que me lembro de ver eles, pareciam universos inteiros. Sinceramente, eu poderia passar o dia todo olhando para você sem me cansar.",
        vestido: "👗 **Vestido:** Lembra das nossas primeiras conversas? A gente conversou sobre várias coisas, inclusive sobre aquele vestido que você ia comprar. Pois é... eu guardo a lembrança desse vestido até hoje.",
        estudos: "📚 **Esforçada:** Você me motiva todo dia a ser um cara melhor e provavelmente rico! Afinal, acredito que para ter uma garota do seu nível ao meu lado, vou precisar ralar e gastar um bom dinheiro. Você é extremamente estudiosa e dedicada, e eu admiro muito isso.",
        buquê: "💐 **O Buquê:** Um dos maiores acertos da minha vida foi te dar um buquê. Mas, confessa... quando te vi com ele, a primeira coisa que eu pensei foi: *'Por que carambas ela tá com a camisa do Flamengo? Estragou tudo!'* 😂 Brincadeiras à parte, acho que me apaixonei de novo quando te vi com ele. Por mim, eu te daria um todo santo mês."
    };

    let viewedCategories = [];

    function openCategory(categoryKey) {
        const textBox = document.getElementById('display-text');
        textBox.innerHTML = categoryData[categoryKey];
        textBox.style.color = "#E2E8F0";
        textBox.style.textAlign = "left";
        textBox.style.justifyContent = "flex-start";

        document.getElementById('nav-back-container').classList.remove('hidden');

        // Efeito de confete ao abrir
        confetti({ particleCount: 30, spread: 50, origin: { y: 0.6 } });

        // Marca como visto
        if (!viewedCategories.includes(categoryKey)) {
            viewedCategories.push(categoryKey);
            document.getElementById(`btn-olhos`).classList.add('viewed');
        }
    }

    function goBackToMenu() {
        const textBox = document.getElementById('display-text');
        textBox.innerHTML = "👈 Clique em um dos tópicos acima para ler!";
        textBox.style.color = "#9CA3AF";
        textBox.style.textAlign = "center";
        textBox.style.justifyContent = "center";

        document.getElementById('nav-back-container').classList.add('hidden');
    }
</script>
</body>
</html>
