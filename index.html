<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Valentina ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-deep: #090B16;
            --bg-card: #121629;
            --accent-purple: #8B5CF6;
            --accent-blue: #3B82F6;
            --text-light: #F3F4F6;
            --text-gold: #FACE15;
            --border-glow: rgba(139, 92, 246, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .welcome-title {
            color: var(--accent-blue);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .step-indicator {
            color: #9CA3AF;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .declaration-card {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 1.25rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #E2E8F0;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #1E2640;
            color: white;
            border: 1px solid #374151;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            transform: translateY(-2px);
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            text-decoration: none;
            display: inline-block;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Tela do Quiz Interativo -->
    <div id="screen-quiz">
        <h1 class="welcome-title">Para Valentina ✨</h1>
        <div class="step-indicator" id="step-counter">Passo 1 de 5</div>
        
        <div class="declaration-card" id="declaration-text">
            Carregando declaração...
        </div>

        <div class="options-container" id="options-box">
            <!-- Os botões de escolha entram aqui via JavaScript -->
        </div>
    </div>

    <!-- Tela Final -->
    <div id="screen-final" class="hidden">
        <h2 style="color: var(--text-gold); font-size: 1.8rem; margin-bottom: 0.5rem;">Você Completou! 🎉</h2>
        <p style="margin-bottom: 1.5rem; color: #D1D5DB; line-height: 1.6;">
            "Mesmo com a camisa do Flamengo, você continua sendo a pessoa mais incrível pra mim. Mal posso esperar para o nosso próximo momento! ❤️"
        </p>

        <a class="btn-action" href="https://api.whatsapp.com/send?text=Oii! Terminei o quiz e li todas as mensagens! Amei demais ❤️✨" target="_blank">
            Mandar mensagem no WhatsApp 💬
        </a>
    </div>
</div>

<script>
    const quizSteps = [
        {
            text: "Lembro até hoje de uma das nossas primeiras conversas, quando você ia comprar um vestido... O que eu acho desse detalhe?",
            options: [
                { text: "Acho fofo que você guardou isso até hoje!", correct: true },
                { text: "Você nem lembra de nada.", correct: false }
            ]
        },
        {
            text: "Admiro demais o quanto você é inteligente, dedicada e focada. O que você mais faz na vida que eu admiro?",
            options: [
                { text: "Estuda e se esforça muito em tudo o que faz.", correct: true },
                { text: "Fica o dia todo assistindo série.", correct: false }
            ]
        },
        {
            text: "E sobre os seus olhos... qual é a verdade sobre eles?",
            options: [
                { text: "Eu me perco completamente neles toda vez que te olho.", correct: true },
                { text: "Nada demais.", correct: false }
            ]
        },
        {
            text: "Um dos maiores acertos da minha vida foi te dar um buquê. Mas qual foi o meu pensamento imediato quando te vi com ele?",
            options: [
                { text: "Por que carambas ela tá com a camisa do Flamengo? Estragou tudo! 😂", correct: true },
                { text: "Nossa, que roupa perfeita.", correct: false }
            ]
        },
        {
            text: "Brincadeiras à parte... o que aconteceu quando te dei aquele buquê?",
            options: [
                { text: "Acho que me apaixonei de novo. Por mim, te daria um todo santo mês! 💐", correct: true },
                { text: "Foi só um presente normal.", correct: false }
            ]
        }
    ];

    let currentStep = 0;

    function loadStep() {
        if (currentStep >= quizSteps.length) {
            showFinalScreen();
            return;
        }

        const step = quizSteps[currentStep];
        document.getElementById('step-counter').innerText = `Passo ${currentStep + 1} de ${quizSteps.length}`;
        document.getElementById('declaration-text').innerText = step.text;

        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';

        step.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${opt.text}</span> ➔`;
            btn.onclick = () => {
                if (opt.correct) {
                    currentStep++;
                    loadStep();
                } else {
                    alert('Opa, pensa bem nessa resposta! 😉 Tenta a outra opção.');
                }
            };
            optionsBox.appendChild(btn);
        });
    }

    function showFinalScreen() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-final').classList.remove('hidden');
        confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
    }

    loadStep();
</script>
</body>
</html>
